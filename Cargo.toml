[package]
name = "pdf_text"
version = "0.1.0"
edition = "2021"
authors = ["Sebastian Köln <s3bk@protonmail.com>"]
keywords = ["pdf", "text", "extract"]
license = "MIT"
description = "PDF text extraction"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Sebastian's forks, fetched over https from the public forks (public since
# 2026-11-13). They were paths into the sibling checkouts before, which nothing
# else could resolve: cargo reads this manifest, so a path that exists only on
# one machine makes the crate unusable as a dependency. They were ssh URLs
# between 2026-11-08 and 2026-11-13, which made every clone need a key with read
# access to s3bk's forks — including a tester's Mac. https needs no key.
pdf = { git = "https://github.com/s3bk/pdf.git", branch = "master", features = ["cache"] }
pdf_render = { git = "https://github.com/s3bk/pdf_render.git", branch = "vello" }
# Pinned to the rev `pdf_render` names, so the two cannot resolve different
# copies of `font`.
font = { git = "https://github.com/pdf-rs/font", rev = "032f427839837c6e1fac7333bd4039d3482d17a7", features = ["cff"] }
itertools = "*"
log = "*"
ordered-float = "*"
serde = { version = "*", features = ["derive"] }
unicode-normalization = "0.1.19"

pathfinder_geometry = { git = "https://github.com/servo/pathfinder" }
pathfinder_color = { git = "https://github.com/servo/pathfinder" }
pathfinder_content = { git = "https://github.com/servo/pathfinder" }
table = { git = "https://github.com/s3bk/table", features = ["serde"] }
